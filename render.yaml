services:
  - type: web
    name: siqap-realtime
    runtime: node
    plan: free
    # `corepack enable` writes to /usr/bin, which is read-only in Render's
    # build image (EROFS). Run the pinned pnpm through npx instead, and start
    # node directly so the runtime never needs a package manager.
    buildCommand: >-
      npx -y pnpm@9.12.0 install --frozen-lockfile &&
      npx -y pnpm@9.12.0 --filter @siqap/shared build &&
      npx -y pnpm@9.12.0 --filter @siqap/db db:generate &&
      npx -y pnpm@9.12.0 --filter @siqap/db build &&
      npx -y pnpm@9.12.0 --filter @siqap/realtime build
    startCommand: node apps/realtime/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Shared PostgreSQL (Neon). sync: false => set the value in the dashboard
      # once; blueprints never overwrite it. No REDIS_URL on purpose: the
      # realtime server falls back to its single-instance memory store.
      - key: DATABASE_URL
        sync: false
