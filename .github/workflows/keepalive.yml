# The realtime service runs on Render's free plan, which spins instances down
# after 15 minutes without traffic. A ping every 10 minutes keeps it awake so
# the exhibition never hits a 50-second cold start (or loses in-memory
# sessions) mid-game.
name: keep-alive

on:
  schedule:
    # Offset by 7 minutes: GitHub docs recommend avoiding the top of the hour
    # (highest Actions load), and changing this expression also re-registers
    # the schedule if GitHub silently stopped honoring it.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the realtime service
        run: |
          curl -fsS \
            --retry 6 \
            --retry-delay 20 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            https://siqap-realtime.onrender.com/health
